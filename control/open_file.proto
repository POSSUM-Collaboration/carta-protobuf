syntax = "proto3";
package CARTA;

import "defs.proto";
import "enums.proto";

// OPEN_FILE:
// Requests the opening of a specific file.
// Backend responds with  OPEN_FILE_ACK
// How a HEALPix map (FITS binary table) is reprojected onto a regular grid for viewing.
// Fields left at their defaults are filled in from the map: all-sky Mollweide in the map's own
// coordinate frame at the HEALPix pixel resolution.
message HealpixOptions {
    // WCS projection code: MOL, AIT, CAR, SFL, ZEA, TAN, SIN, HPX, ... (empty = MOL)
    string projection = 1;
    // Celestial frame of the grid: G (galactic), C (ICRS/equatorial), E (ecliptic); empty = the map's frame
    string frame = 2;
    // Reference (centre) position in degrees, used when has_center is set
    bool has_center = 3;
    double center_lon = 4;
    double center_lat = 5;
    // Pixel scale in degrees; 0 = HEALPix pixel resolution
    double pixel_scale = 6;
    // Grid size in pixels; 0 = enough to cover the sky (or 90 degrees for zenithal projections)
    sfixed32 width = 7;
    sfixed32 height = 8;
    // Bilinear interpolation between the four nearest HEALPix pixels instead of nearest pixel
    bool bilinear = 9;
    // Table columns to load; empty = all data columns (I/Q/U/V columns become a Stokes axis)
    repeated string columns = 10;
    // Reproject onto the pixel grid and WCS of an already open image instead (overrides the fields above)
    bool match_image = 11;
    sfixed32 match_file_id = 12;
}

message OpenFile {
    // Required directory name
    string directory = 1;
    // File name or LEL expression
    string file = 2;
    // Which HDU to load (if applicable). If left blank, the first HDU will be used
    string hdu = 3;
    // Which "file" slot to load the file into (when viewing multiple files)
    sfixed32 file_id = 4;
    // The render mode to use. Additional modes will be added in subsequent versions.
    RenderMode render_mode = 5;
    // Defines whether file is LEL expression
    bool lel_expr = 6;
    // Defines whether to support AIPS beam in FITS history headers
    bool support_aips_beam = 7;
    // Optional permutation of the file's axes (0-based file axis for each image axis): the first two entries are rendered,
    // the third is the depth axis. Empty = file order.
    repeated sfixed32 axis_order = 8;
    // Reprojection settings for HEALPix maps (ignored for other files)
    HealpixOptions healpix = 9;
}

// OPEN_FILE_ACK
// Response for OPEN_FILE. Also supplies file information
message OpenFileAck {
    // Defines whether OPEN_FILE was successful
    bool success = 1;
    // Which file slot the file was loaded into (when viewing multiple files)
    sfixed32 file_id = 2;
    // Error message (if applicable)
    string message = 3;
    // Basic file info (type, size)
    FileInfo file_info = 4;
    // Extended file info (WCS, header info)
    FileInfoExtended file_info_extended = 5;
    // Optional bitflags specifying feature flags of the file being opened.
    fixed32 file_feature_flags = 6;
    // Beam table for multiple-beam images
    repeated Beam beam_table = 7;
}
